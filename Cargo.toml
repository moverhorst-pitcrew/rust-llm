[workspace]
members = ["crates/llm-core", "crates/rust-llm"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
flate2 = "1"
half = "2"
memmap2 = "0.9"
serde_json = "1"
thiserror = "2"
tokenizers = { version = "0.23", default-features = false, features = [
    "fancy-regex",
] }

llm-core = { path = "crates/llm-core" }

# The kernels are only meaningful when inlined and vectorised, and the
# microbenchmark is built through the bench profile, which inherits this one.
[profile.release]
codegen-units = 1
lto = "thin"
